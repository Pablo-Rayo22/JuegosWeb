
<!DOCTYPE html>  <!-- Para indicar al navegador web que tiene que leer un HTML-->
<html lang = "es"> <!-- Idioma que utilizará la página el navegador -->
    <head>
        <meta charset = "UTF-8"/>
        <title> Juego Plataformas </title>
        <script src = "https://cdn.jsdelivr.net/npm/phaser@v3.90.0/dist/phaser.min.js"></script>
        <!-- Defer type es para que el juego se vaya cargando en paralelo mientras se cargan otros recursos-->
        <!-- Module es para poder realizar importaciones de ficheros .js en otros ficheros .js -->
        <script  defer type = "module" src = "Scripts/Juego.js"></script> 
    </head>
</html>
